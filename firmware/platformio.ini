; Mission Control
; ELECROW CrowPanel 7" DIS08070H V3.0

[platformio]
src_dir = src
boards_dir = .

[env:crowpanel-7]
platform = espressif32
board = esp32-s3-devkitc-1-myboard
framework = arduino
build_src_filter =
    +<*>
    -<diagnostics/>

platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32#2.0.3

upload_speed = 115200
monitor_speed = 115200

build_flags =
    -DLV_CONF_SKIP
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_USE_PNG=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_28=1
    ; The dashboard uses six PNG icons at once (plus weather variants). Keeping
    ; only two decoded images forced repeated PNG decoding on every screen load,
    ; making the partial RGB refresh visibly sweep across the dashboard.
    -DLV_IMG_CACHE_DEF_SIZE=12
    -DLV_MEM_CUSTOM=1
    -DLV_MEM_CUSTOM_INCLUDE=\"lvgl_psram.h\"
    -DLV_MEM_CUSTOM_ALLOC=missionControlLvglAlloc
    -DLV_MEM_CUSTOM_FREE=missionControlLvglFree
    -DLV_MEM_CUSTOM_REALLOC=missionControlLvglRealloc
    -I./include

lib_deps =
    lvgl/lvgl@8.3.6
    tamctec/TAMC_GT911@1.0.2
    moononournation/GFX Library for Arduino@1.2.8
    lovyan03/LovyanGFX@1.1.12
    bblanchon/ArduinoJson@^7.4.2
    bitbank2/JPEGDEC@^1.8.4
    https://github.com/sparkfun/SparkFun_SGP4_Arduino_Library.git#v1.0.4

board_build.partitions = huge_app.csv
lib_ldf_mode = deep+

[env:network-diagnostic]
extends = env:crowpanel-7
build_src_filter =
    -<*>
    +<diagnostics/NetworkDiagnostic.cpp>
